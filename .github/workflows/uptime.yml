name: Uptime
# ufc.sh checked from outside the host every 10 minutes. GitHub emails the
# owner when a scheduled run fails; Grafana on the VPS can't if the VPS is down.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site answers
        run: |
          for url in https://ufc.sh/readyz https://ufc.sh/; do
            curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 15 -o /dev/null "$url"
          done
