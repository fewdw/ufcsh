name: Choose dev branch
# Pick a branch in the "Use workflow from" dropdown and run: that branch is
# shown at dev.ufc.sh.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-dev-branch.yml
    with:
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets: inherit
