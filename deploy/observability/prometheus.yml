global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ufc-app
    metrics_path: /metrics
    static_configs:
      - targets: [app:9091]
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
