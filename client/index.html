<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ask for the page's data now, alongside the application's code, rather
      // than after it has loaded; `apiCache` in src/api.ts takes these. The
      // URLs match src/pageRequests.ts, which keys the same requests.
      (function () {
        var ranking = "media", path = location.pathname, m, urls = ["/api/live"], root = document.documentElement;
        // The saved theme is on the page before anything is drawn, and colour
        // transitions wait for the first frames, so nothing flashes light
        // (src/settings.tsx keeps the class in step afterwards).
        root.classList.add("no-transitions");
        try {
          var settings = JSON.parse(localStorage.getItem("ufcsh:settings:v1") || "null") || {};
          if (settings.rankingSource === "meta") ranking = "meta";
          if (settings.theme === "dark") { root.classList.add("dark"); root.style.colorScheme = "dark"; }
        } catch (e) {}
        var ranked = function (url) { return url + "?ranking=" + ranking; };
        if (path === "/") urls.push("/api/events");
        else if ((m = /^\/events\/([a-f0-9]{16})$/.exec(path))) urls.push("/api/events", ranked("/api/events/" + m[1]));
        else if ((m = /^\/fights\/([a-f0-9]{16})$/.exec(path))) urls.push("/api/events", ranked("/api/fights/" + m[1]));
        else if ((m = /^\/fighters\/([a-f0-9]{16})$/.exec(path))) urls.push(ranked("/api/fighters/" + m[1]), "/api/fighters/" + m[1] + "/stats?scope=ufc&minBouts=0");
        else if (path === "/rankings") urls.push(ranked("/api/rankings"));
        else if (path === "/officials" || path === "/venues") urls.push("/api" + path);
        else if (!location.search && (m = /^\/(judges|referees|venues)\/([a-z0-9-]{1,80})$/.exec(path))) urls.push("/api/" + m[1] + "/" + m[2]);
        var responses = {};
        urls.forEach(function (url) { responses[url] = fetch(url).catch(function () { return null; }); });
        window.__ufcPreload = { at: Date.now(), responses: responses };
      })();
    </script>
    <title>#1 UFC Data Platform: Events, Odds, Stats &amp; Rankings | ufc.sh</title>
    <meta
      name="description"
      content="The #1 UFC data platform: fight cards, matchup odds, results, fighter statistics and current rankings in one fast interface."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="ufc.sh" />
    <meta name="theme-color" content="#18181b" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="__SITE_ORIGIN__/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="ufc.sh" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="#1 UFC Data Platform: Events, Odds, Stats &amp; Rankings | ufc.sh" />
    <meta
      property="og:description"
      content="The #1 UFC data platform: fight cards, matchup odds, results, fighter statistics and current rankings in one fast interface."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="#1 UFC Data Platform: Events, Odds, Stats &amp; Rankings | ufc.sh" />
    <meta
      name="twitter:description"
      content="The #1 UFC data platform: fight cards, matchup odds, results, fighter statistics and current rankings in one fast interface."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ufc.sh",
        "url": "__SITE_ORIGIN__/",
        "description": "The #1 UFC data platform: fight cards, matchup odds, results, fighter statistics and rankings."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ufc.sh requires JavaScript to display UFC fight cards, matchup statistics, odds and rankings.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
